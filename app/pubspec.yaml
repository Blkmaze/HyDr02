name: hydr02
description: Personal Android TV IPTV player (Xtream Codes + M3U + XMLTV EPG + OpenVPN). Ships empty -- add your own server.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  http: ^1.2.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  # Deliberately NOT a caret constraint. wakelock_plus 1.3+ requires
  # package_info_plus 10.x, which collides with the ^8.0.0 pin above and
  # fails resolution ("tried to update package_info_plus"). The 1.2.x line
  # accepts package_info_plus <9.0.0 and does everything needed here.
  # If you ever widen this, bump package_info_plus in the same commit.
  wakelock_plus: ">=1.2.8 <1.3.0"
  xml: ^6.5.0
  package_info_plus: ^8.0.0
  openvpn_flutter: ^1.3.4
  url_launcher: ^6.3.0
  path_provider: ^2.1.0
  open_filex: ^4.3.0
  qr_flutter: ^4.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding.json
    - assets/logo.png
